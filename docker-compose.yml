services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermespass
      POSTGRES_DB: hermes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper — required by Kafka for broker coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hermes-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hermes-net

  # Kafka — durable task queue
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hermes-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - hermes-net

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: hermes-otel-collector
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml
    command: ["--config=/etc/otel-collector-config.yml"]
    networks:
      - hermes-net

  # Jaeger — distributed trace UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hermes-jaeger
    ports:
      - "16686:16686"
    networks:
      - hermes-net

  # Prometheus — metrics storage
  prometheus:
    image: prom/prometheus:latest
    container_name: hermes-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - hermes-net

  # Grafana — metrics dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: hermes-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - hermes-net

  # Coordinator — main FastAPI + gRPC service
  coordinator:
    build: ./coordinator
    container_name: hermes-coordinator
    ports:
      - "8080:8000"
      - "50051:50051"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - hermes-net

  # Worker A — fast worker, never fails
  worker-a:
    build: ./worker
    container_name: hermes-worker-a
    ports:
      - "8001:8001"
    environment:
      WORKER_ID: worker-a
      WORKER_FAILURE_RATE: "0.0"
      WORKER_TASK_DURATION: "0.3"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TASKS_TOPIC: hermes.tasks
      COORDINATOR_GRPC_ADDRESS: coordinator:50051
      ENABLE_DEBUG_ENDPOINTS: "true"
    depends_on:
      - kafka
      - coordinator
    networks:
      - hermes-net

  # Worker B — slow worker, never fails
  worker-b:
    build: ./worker
    container_name: hermes-worker-b
    ports:
      - "8002:8001"
    environment:
      WORKER_ID: worker-b
      WORKER_FAILURE_RATE: "0.0"
      WORKER_TASK_DURATION: "4.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TASKS_TOPIC: hermes.tasks
      COORDINATOR_GRPC_ADDRESS: coordinator:50051
      ENABLE_DEBUG_ENDPOINTS: "true"
    depends_on:
      - kafka
      - coordinator
    networks:
      - hermes-net

  # Worker C — flaky worker, 40% failure rate
  worker-c:
    build: ./worker
    container_name: hermes-worker-c
    ports:
      - "8003:8001"
    environment:
      WORKER_ID: worker-c
      WORKER_FAILURE_RATE: "0.4"
      WORKER_TASK_DURATION: "1.5"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TASKS_TOPIC: hermes.tasks
      COORDINATOR_GRPC_ADDRESS: coordinator:50051
      ENABLE_DEBUG_ENDPOINTS: "true"
    depends_on:
      - kafka
      - coordinator
    networks:
      - hermes-net

# Named volumes
volumes:
  postgres_data:
  grafana_data:

# Internal Docker network
networks:
  hermes-net:
    driver: bridge
